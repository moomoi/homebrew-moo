name: Update formulas

# Regenerate Casks/moo.rb for a Moo release: download the published DMG, compute its SHA-256 and
# commit. Same as duneyou/homebrew-dune.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Moo release version, without the leading v (e.g. 0.1.0)"
        required: true
        type: string
      source_repo:
        description: "Repo that publishes the release assets"
        default: "moomoi/moo"
        required: false
        type: string
  # Fired by knoeone/moo's publish-public.yml after a public release.
  # client_payload: { version: "0.1.0", source_repo: "moomoi/moo" }
  repository_dispatch:
    types: [release]

permissions:
  contents: write

concurrency:
  group: update-formulas
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Resolve inputs
        id: in
        env:
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
          PAYLOAD_REPO: ${{ github.event.client_payload.source_repo }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REPO: ${{ inputs.source_repo }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            V="$PAYLOAD_VERSION"; REPO="$PAYLOAD_REPO"
          else
            V="$INPUT_VERSION"; REPO="$INPUT_REPO"
          fi
          [ -n "$REPO" ] || REPO="moomoi/moo"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "not a version: '$V'" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "source_repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Download the DMG and compute SHA-256
        id: sha
        run: |
          set -euo pipefail
          URL="https://github.com/${{ steps.in.outputs.source_repo }}/releases/download/v${{ steps.in.outputs.version }}/Moo-macos-universal.dmg"
          curl -fsSL --retry 5 --retry-delay 10 -o /tmp/moo.dmg "$URL"
          echo "dmg=$(sha256sum /tmp/moo.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Regenerate the cask
        env:
          VERSION: ${{ steps.in.outputs.version }}
          REPO: ${{ steps.in.outputs.source_repo }}
          SHA: ${{ steps.sha.outputs.dmg }}
        run: |
          set -euo pipefail
          mkdir -p Casks
          cat > Casks/moo.rb << 'CASK'
          # typed: false
          # frozen_string_literal: true

          # Moo, the keyboard launcher. Universal (Apple silicon and Intel), signed and notarized.
          # Generated by .github/workflows/update-formulas.yml; edits here are overwritten.
          cask "moo" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA_PLACEHOLDER"

            url "https://github.com/REPO_PLACEHOLDER/releases/download/v#{version}/Moo-macos-universal.dmg"
            name "Moo"
            desc "Keyboard launcher for apps, files, the clipboard, AI and more"
            homepage "https://moo.moi"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on macos: ">= :sonoma"

            app "Moo.app"
            # The app binary is also the `moo` command line client.
            binary "#{appdir}/Moo.app/Contents/MacOS/moo"

            uninstall quit: "moi.moo.launcher"

            zap trash: [
              "~/Library/Application Support/Moo",
              "~/Library/Caches/Moo",
              "~/Library/Preferences/moi.moo.launcher.plist",
            ]
          end
          CASK
          sed -i \
            -e "s|VERSION_PLACEHOLDER|${VERSION}|g" \
            -e "s|SHA_PLACEHOLDER|${SHA}|g" \
            -e "s|REPO_PLACEHOLDER|${REPO}|g" \
            Casks/moo.rb
          cat Casks/moo.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/moo.rb
          if git diff --staged --quiet; then
            echo "No cask changes"
          else
            git commit -m "moo ${{ steps.in.outputs.version }}"
            git push
          fi
